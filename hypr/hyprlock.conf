$font = TerminessNerdFont
general {
    hide_cursor = true
    fail_timeout = 5000
}

# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path =
    blur_passes = 4
    blur_size = 4
}

image {
  monitor =
  path = /home/$USER/.config/Pictures/PHCT.png
  size = 300
  rounding = -1
  border_size = 0
  border_color = rgb(15,15,15)
  rotate = 0
  reload_time = -1
  position = 0, 0
  halign = center
  valign = center
}

input-field {
    monitor =
    size = 12.5%, 20%
    outline_thickness = 5
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(bdedffff)
    check_color = rgba(fbfeffff)
    fail_color = rgba(9d00ffff)
    hide_input = true
    hide_input_base_color = rgba(251, 254, 255, 1.0)
    rounding = -1
    # font_color = rgba(251, 254, 255, 1.0)
    fade_on_empty = true
    fade_timeout = 1000
    rounding = -1

    font_family = $font
    placeholder_text =
    fail_text = 

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    # dots_spacing = 0.3

    position = 0, 0
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}
